 # gui/event_window_wigets_l_spanish.yml
 event_window_widget_harrying_tooltip_widget:0 "El Tormento del Norte [harrying_widget_i] mide los valores de [harrying_resistance|lE] y [harrying_pacification|lE]. Estos tienen efectos sobre los dos principales grupos involucrados en la región: el gobernante normando de Inglaterra y cualquier vasallo anglosajón de nivel [duke|lE] que pueda haber.\n\nUna [harrying_resistance|lE] mayor representa la resistencia anglosajona a la ocupación normanda, y niveles altos pueden suponer menos [cultural_acceptance|lE] anglosajona/normanda, menos [county_control|lE], una mayor probabilidad de [claimant_factions|lE] o incluso una [civil_war|lE].\n\nUna [harrying_pacification|lE] más alta suponer mayor [cultural_acceptance|lE] anglosajona/normanda, mayor [county_control|lE] y menor probabilidad de [claimant_factions|lE]."

 # gui/great_holy_war_view_l_spanish.yml
