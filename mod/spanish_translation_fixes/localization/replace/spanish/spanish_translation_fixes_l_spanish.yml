 # house_relations_l_spanish.yml
 house_relation_reason_festival_increase_desc:0 "A [char.GetShortUINameNotMe|U] y [target_char.GetShortUINameNotMe] se les vio disfrutando [Select_CString(And(char.IsFemale, target_char.IsFemale), 'juntas', 'juntos')] de un festival"

 # important_actions_l_spanish.yml
 action_hegemonic_tributary_has_low_subject_standing_suzerain_desc:0 "Un[recipient.Custom('ES_OA')] de tus [tributaries|lE], [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUIName], ha descuidado mucho sus deberes y hace tiempo que no realiza contribuciones a tu persona.$action_hegemonic_tributary_has_low_subject_standing_suzerain_help_desc$"

