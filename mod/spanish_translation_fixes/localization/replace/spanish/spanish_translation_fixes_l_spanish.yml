 # event_localization/laamp_events_l_spanish.yml
 ep3_laamp_flavour_ewan.0011.desc.chaste:0 "aquí presente es un[mockee.Custom('ES_XA')] apóstol de la castidad. ¡Y que me aspen si no es lógico, porque de otro modo, sería una desgracia para [mockee.GetSheHe] con esa cara que tiene!»."
 ep3_laamps.6016.ending:0 "[powerful_vassal.GetFirstNameNoTooltip] vuelve a abrir la boca, pero la puerta abierta de golpe frena su intención en seco. Un mensajero, empapado y con ojos desorbitados, corta la reacción indignada de [powerful_vassal.GetFirstNameNoTooltip] presentando una carta.\n\nEspero a que [powerful_vassal.GetFirstNameNoTooltip] parta el sello y revise el pergamino.\n\nSu rostro empalidece poco a poco."
 ep3_laamps.6021.desc:0 "Mi legítima instauración en el trono de Inglaterra ha demostrado ser suficiente para partir la cuerda deshilachada que mantenía unida a Inglaterra. Los levantamientos locales, promovidos y avivados por los derrotados y resentidos [Glossary( 'Æthelings', 'AETHELINGS_GLOSS' )] anglosajones, se extienden por todo el país como un reguero de pólvora.\n\nUna vez asegurada mi base de poder en el sur, ahora he de mirar al norte para pacificar a aquellos tan valientes y necios como para desafiarme. Allá donde caiga mi mirada, le seguirán la muerte y la destrucción, para evitar que mi puesto sea usurpado por lugareños maquinadores.\n\nHe de recorrer una fina línea entre el guante de seda y la mano dura. Una mano demasiado suave puede hacerme perder el reino, pero unos castigos demasiado brutales no me dejarán mucho reino que gobernar. Sin embargo, para los Æthelings…\n\nNo habrá clemencia para quienes no entregaron su lealtad."

 # event_localization/lifestyle/commission_epic_events_l_spanish.yml
 commission_epic.2002.desc:0 "[spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)|U] parece ser la última persona que ha [ROOT.Char.Custom('CompositionTypeActionPast')] extractos de mi epopeya familiar.\n\n«Vuestr[grandparent.Custom('ES_OA')] tatarabuel[grandparent.Custom('ES_OA')] era una persona fascinante y llena de recursos», me dice. «Si se nos conociera por ser siquiera la mitad de taimados que [grandparent.Custom('ES_ElElla')], la gente se lo pensaría dos veces antes de actuar contra vos»."

 # event_localization/lifestyle/guile/intrigue_scheming_events_l_spanish.yml
 intrigue_scheming.1801.b:0 "No es nada más que una extorsión hueca."

 # event_localization/lifestyle/guile/intrigue_temptation_events_l_spanish.yml
 intrigue_temptation.3010.start.desc:0 "Por tercera noche seguida, me encuentro en la misma mesa, en la misma posada. Tiene una vista excelente de la barra y [bar_servant.Custom('ES_DelDela')] cautivador[bar_servant.Custom('ES_XA')] [bar_servant.Custom('bar_servant')] tras ella.\n\nMi ensoñación se ve interrumpida cuando [wingman.Custom2('MyCharacterIntroduction', ROOT.Char)] estampa su jarra sobre la mesa. «Llevas toda la noche mirando embobad[ROOT.Char.Custom('ES_OA')] a [bar_servant.GetFirstName]», susurra con una sonrisa pícara. «No te culpo, es tod[bar_servant.Custom('ES_OA')] un[bar_servant.Custom('ES_XA')]"

 # event_localization/lifestyle/mystic_lifestyle_events_l_spanish.yml
 mystic_lifestyle.1009.opening:0 "Estimad[SCOPE.sC('mystic').Custom('ES_OA')] [SCOPE.sC('mystic').Custom2('RelationToMeShort', ROOT.Char )]"

 # event_localization/lifestyle/scholarship/learning_theology_events_l_spanish.yml
 learning_theology.3054.b:0 "¡Es hora de que [ROOT.Char.Custom2('RelationToMeShort', family_actor)] brille!"
 learning_theology.3055.desc.victory.hired_actor:0 "\n\nPara mi deleite, [lead_actor.GetSheHe] realiza una actuación no ya digna de mis escritos, ¡sino de [ROOT.Char.GetFaith.HighGodName] en persona! "

 # event_localization/lifestyle/wanderer/journey_l_spanish.yml
 journey_events.30.desc:0 "Me topo con [character_1.GetFirstName] y [character_2.GetFirstName] cuando hablan [Select_CString(And(character_1.IsFemale, character_2.IsFemale),'juntas muy animadas','juntos muy animados')]. «¿De verdad? ¿En [traveller_province.GetName], habéis dicho?». En cuanto se dan cuenta de mi presencia, [character_1.GetFirstName] se vuelve hacia mí y me pregunta: «Vos estuvisteis allí en uno de vuestros viajes, ¿no?».\n\n«Veréis, [character_2.GetFirstNameNoTooltip] me dice que vio [traveller_province.Custom('journey_events_30_custom_loc')] en [traveller_province.GetNameNoTooltip]. ¿Contemplasteis vos algo parecido?»."

 # event_localization/marriage_effect_events_l_spanish.yml
 marriage_effect.1001.a:0 "¡Ven aquí, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse') )] mí[SCOPE.sC('spouse').Custom('ES_OA')]!"

 # event_localization/prison_events/prison_events_l_spanish.yml
 prison.1002.rats.desc:0 "Las ratas del cubo pueden parecer retraídas al principio, pero son capaces de roer alegremente el pecho de un[recipient.Custom('ES_OA')] [recipient.GetWomanMan] cuando se aplica algo de calor. Según le explico el concepto [recipient.Custom('ES_AlAla')] [recipient.GetTitledFirstName|l], su resolución se deshace ante mis ojos."

 # event_localization/relation_events/lover_events_l_spanish.yml
 lover.1001.desc:0 "Mi [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('snoopy_lover') )], [snoopy_lover.Custom('ES_ElLa')] [snoopy_lover.GetTitledFirstName|l], consigue oír muchas cosas en sus idas y venidas a mi [ROOT.Char.Custom('GetCourt')|l].\n\nHace poco se enteró de unas historias muy interesantes sobre lo que mi [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('secret_holder') )], [secret_holder.Custom('ES_ElLa')] [secret_holder.GetTitledFirstName|l], hace en las sombras…"
 lover.1002.desc:0 "[ROOT.GetCharacter.Custom('LoverPetName_possessive')|U], [lover.Custom('ES_ElLa')] [lover.GetTitledFirstName|l], sabe mucho sobre cómo gestionar las muchas relaciones de mi [ROOT.Char.Custom('GetCourt')|l]. Me ha sugerido que aproveche su experiencia para mis acercamientos diplomáticos hacia [target.Custom('ES_ElLa')] [target.GetTitledFirstName|l]."

 # event_localization/relation_events/spouse_events_l_spanish.yml
 spouse.2011.desc:0 "¡Por más que intentaba arreglarlo, todo lo que decía sobre mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] parecía un insulto en lugar de un halago! Cuando nos íbamos, [told_of_character.GetFirstName] solo negó con la cabeza mirando a [spouse.GetFirstName]."

 # event_localization/religion_events/religious_decision_events_l_spanish.yml
 religious_decision.0002.desc_alone:0 "\n\n«Espíritus, escuchadme. ¡Valorad mi ofrenda y ayudadme en mi súplica!», exclamo a la ahora penumbra de la hondonada.\n\nMientas sigo dando vueltas, me llega una repentina oleada de energía. El sudor me baña la frente y mis miembros se mueven frenéticamente, cada vez más deprisa. Me muevo, me muevo, me #EMP muevo#!, hasta que al final me desplomo sobre el suelo, jadeando."

 # event_localization/schemes/intrigue_scheme_ongoing_events_l_spanish.yml
 intrigue_scheme_ongoing.5006.a:0 "¡Qué inesperado! Y qué efecto más curioso."

 # event_localization/travel_events/tgp_travel_events_l_spanish.yml
 tgp_travel_events.0035.desc.outro:0 "\n\nUn[farmer_char.Custom('ES_XA')] granjer[farmer_char.Custom('ES_OA')] se encuentra a un lado del camino, se inclina sobre la rueda que se ha caído de su carromato. Nos ve a mi enviado y a mí y su expresión se convierte en la de un[farmer_char.Custom('ES_XA')] [farmer_char.GetMotherFather] sever[farmer_char.Custom('ES_OA')]. «Reclutasteis a mi hijo para luchar en vuestra guerra. No tendría que deslomarme así si estuviera aquí». \n\nAl mirar hacia los campos, me fijo en los pocos granjeros que hay. Deben de compartir un destino similar."
 tgp_travel_events.0040.desc.outro:0 "\n\n«¡Mi [ROOT.Char.GetTitleAsNameNoTooltip|l]!», me grita el granjero. «Este buey es mío, ¡me lo robaron anoche del establo! ¡Debe de haber sido obra [parent.Custom('ES_DelDela')] inútil de su [parent.GetMotherFather], [Select_CString(parent.IsFemale, 'una borracha y una ladrona', 'un borracho y un ladrón' )] ¡y est[farmer_child.Custom('ES_EA')] [farmer_child.Custom('GirlBoy')] siempre oculta sus fechorías!». \n\nMiro [farmer_child.Custom('ES_AlAla')] [farmer_child.Custom('GirlBoy')], que empalidece y tiembla visiblemente."
 tgp_travel_events.0041.f:0 "[farmer_child.Custom('ES_ElLa')|U] [farmer_child.GetTitledFirstName|l] debería quedarse como tutor[farmer_child.Custom('ES_XA')]."
 tgp_travel_events.0041.g:0 "¡[farmer_child.Custom('ES_ElLa')|U] [farmer_child.GetTitledFirstName|l] seguirá a mi servicio!"
 tgp_travel_events.0041.g.tt:0 "[farmer_child.Custom('ES_ElLa')|U] [farmer_child.GetTitledFirstName|l] seguirá a tu servicio como tu [THIS.Char.Custom2('RelationToMeShort', SCOPE.sC('farmer_child'))]."

 # event_localization/travel_events/travel_danger_events_l_spanish.yml
 travel_danger_events.1013.c:0 "No quiero arriesgarme a que se pierda más gente."

 # event_localization/travel_events/travel_events_filippa_l_spanish.yml
 travel_events.2010.desc:0 "\n\nDe repente, un chillido agudo atraviesa el aire. Acelero el paso solo para encontrar a "

 # event_localization/travel_events/travel_events_l_spanish.yml
 travel_events.4023.desc.intro:0 "Existen leyendas sobre un[prester_john_scope.Custom('ES_XA')] [prester_john_scope.GetPrimaryTitle.GetTierAsNameNoTooltip] de fe [ROOT.Char.GetFaith.GetReligion.GetAdjective] rodead[prester_john_scope.Custom('ES_OA')] de herejes e infieles. ¡Un día, semejante [prester_john_scope.GetTitleAsNameNoTooltip] legendari[prester_john_scope.Custom('ES_OA')] de [prester_john_scope.GetPrimaryTitle.GetTierAsNameNoTooltip] tomará las armas contra los malvados y los abatirá con furia santa!\n\n"

 # event_localization/war_event/raid_events_l_spanish.yml
 raiding.0004.desc.spared_plundered:0 "Mi vasall[sacked_county_owner.Custom('ES_OA')] [sacked_county_owner.GetName] me informa de que unos asaltantes han penetrado en [sacked_barony.GetNameNoTier], pero una fortificación clave protege la mayor parte de [sacked_county.GetNameNoTierNoTooltip]. [raider.GetName] ha de frenar el ataque de sus [raider.Custom('GetFighterTermPlural')], y sus saqueos disminuyen.\n\nAunque las tierras [sacked_county_owner.Custom('ES_DelDela')] [sacked_county_owner.GetTitledFirstNameNoTooltip|l] se han salvado en cierta medida, la mirada de [raider.GetPrimaryTitle.GetName] aún observa con avidez otros dominios…"

 # event_localization/yearly_events/bp1_yearly_events_chad_l_spanish.yml
 bp1_yearly.3004.desc:0 "Vuelvo a mi [ROOT.Char.Custom('FortifiedBuilding')] tras un largo y solitario paseo. Un año más, un año más viej[ROOT.Char.Custom('ES_OA')]…\n\nNací este día hace [ROOT.Char.GetAge] años. Cuando mayor me hago, más celebro las relaciones que he cultivado a lo largo de los años… "

 # event_localization/yearly_events/yearly_events_3_l_spanish.yml
 yearly.3001.b:0 "¡[vassal.GetSheHe|U] es culpable y [vassal.Custom('ES_LoLa')] acusaré públicamente!"

 # event_localization/yearly_events/yearly_events_7_l_spanish.yml
 yearly.7052.desc_unconvinced:0 "Me despierto, empapad[ROOT.Char.Custom('ES_OA')] en sudor. Esta ha sido, si no la peor, una de las más horribles pesadillas que puedo recordar.\n\nLa manos aún me tiemblan del estrés que me ha causado el sueño, mientras recuerdo sus contenidos. «Seguro que las cosas ya no pueden ir a peor», mascullo, mientras me doy la vuelta, en un patético intento de volverme a dormir."
 yearly.7053.b_pouch.desc:0 "Sacas una bolsa de monedas de oro del agujero"

 # game_concepts_l_spanish.yml
 game_concept_extended_family_desc:0 "La familia extensa de un personaje incluye:\n$BULLET_WITH_TAB$Primos y primas\n$BULLET_WITH_TAB$Tíos\n$BULLET_WITH_TAB$Tías\n$BULLET_WITH_TAB$Sobrinos\n$BULLET_WITH_TAB$Sobrinas"
 game_concept_co_monarchy_desc:0 "$game_concept_co_monarchies$ son un tipo de [diarchy|lE] que proporciona a los gobernantes de tipo [feudal|lE] un modo de elegir un [designated_heir|lE] hasta en [eras|lE] anteriores.\n\nEl coste que tiene es que se entra en una $game_concept_diarchy$ con el heredero, lo que le proporciona un acceso más fácil a muchos de los mismos poderes que un [entrenched_regent|lE].\n\n#WEAK Los $game_concept_co_monarchs$ solo están disponibles para [kings|lE] y [emperors|lE].#!"

 # game_rules_l_spanish.yml
 game_rule.1101.desc.outro.present:0 "Dejo de pensar mientras el mundo se convierte en un borrón de tajos y cuchilladas, los miembros de mi casa apretados con fuerza en torno a mí mientras aplastamos al ejército [loser.Custom('ES_DelDela')] [loser.GetTitledFirstName|l]. Bajo mi espada, el enemigo huye."
 setting_coronation_laws_no_imperial_uncrowned_desc:0 "Los [kings|lE] no estarán [GetLaw('uncrowned').GetName|l] si ascienden al [title_tier|lE] de [emperor|lE]."

 # great_projects/great_project_types_l_spanish.yml
 holder_has_military_appointment_tt:0 "[THIS.Char.Custom('GetProvinceAdministrationConcept')] de [Select_CString( THIS.Char.IsLocalPlayer, 'tu personaje', THIS.Char.GetShortUIName )] #bold no#! es una [governorship|El] militar"

 # great_projects/pam_great_project_types_l_spanish.yml
 pam_great_projects_events.0003.desc:0 "«#EMP Brillante es aquello que se une brillantemente con lo brillante, y brillante será la noble obra que se impregne de la nueva luz»#!, expresa [religion_buddy.Custom('ES_ElLa')] [religion_buddy.GetTitledFirstName|l] al posar los ojos sobre el vidrio cortado que resplandece con el sol.\n\n[glazier.Custom('ES_ElLa')|U] vidrier[glazier.Custom('ES_OA')], [glazier.Custom('ES_ElLa')] [glazier.GetTitledFirstName|l], ha puesto fragmentos de [Glossary('vidrio de crisol','POT_METAL_GLOSS')] sobre mesas encaladas para que pudiéramos examinar mejor los posibles diseños.\n\nEntonces declaro: «Este ventanal se verá tanto desde la nave como desde la totalidad de [province.GetNameNoTooltip], debe representar…»."

