 # laamp_contract_schemes_l_spanish.yml
 laamp_base_contract_schemes.6002.desc:0 "Tres… cuatro… y ahí va el quinto ejemplar de [ROOT.Char.MakeScope.Var('animal_type').GetFlagName] de esta mañana. Echo el cuerpo al carro, justo a tiempo para que [employer.Custom('ES_ElLa')] [employer.GetTitledFirstName|l] llegue con algún sirviente.\n\n«¡Qué trabajo más magnífico!», aplaude [employer.GetSheHe]. «Basta de ganado muerto, de niños perdidos. Tened, vuestro pago; y si el pueblo llano vuelve a quejarse, ya sé a quién volver a llamar»."
 laamp_base_contract_schemes.0661.desc:0 "El problema en esta zona parece bastante sencillo: en un lado, los lugareños afirman que se les exige que envíen demasiad[dummy_soldier.Custom('ES_OA')]s [dummy_soldier.GetWomenMen] al servicio militar, mientras que la otra parte dice lo contrario.\n\nSacarles más detalles degenera inevitablemente en gritos y alzamiento de horquillas. Ambos bandos parecen más que dispuestos a matarse entre ellos en su disputa sobre quién debe contribuir más a la defensa colectiva."
 laamp_base_contract_schemes.2311.desc.business.council_chamber:0 "Las dependencias de [char_current.GetFirstName] como [char_current.GetTitleAsNameNoTooltip|l] de la ciudad son sorprendentemente grandes. [char_current.GetFirstNameNoTooltip] me lleva a una sala que obviamente sirve para que hablen las personas más importantes del asentamiento y me sienta a la cabeza de la mesa."

 # memories_filippa_l_spanish.yml
 flawless_mandala_trials_memory:0 "demostró ser de forma impecable una sucesión divina digna [previous_mandala_ruler.Custom('ES_DelDela')] [previous_mandala_ruler.GetTitledFirstName|l]"

 # memories_l_spanish.yml
