 # single_combat_events_l_spanish.yml
 single_combat.0031.desc.sc_attacker.feint_and_stab.fatality:0 "lo que me distrae lo suficiente como para que no note [sc_victor.Custom('SignatureWeaponAttemptedLight')] posterior, [sc_victor.Custom('SignatureWeaponKillTypeTorso2PresentParticiple')].\n\nMe tambaleo y luego caigo contra el/la [sc_defender.Custom('GroundType')], convulsionando, intentando gritar pero incapaz de emitir más de un susurro ronco. ¿Cómo se puede sobrevivir a tanto #EMP dolor#!?\n\nNo se puede."
 single_combat.0041.desc.opponent_response.strict_guard:0 "Aparte de lo que sea [sc_loser.GetFirstNameNoTooltip], se le da condenadamente bien mantener la guardia. Es más por suerte que habilidad que logre finalmente"
 single_combat.0041.desc.sc_attacker.expert_onslaught.injury:0 "Golpe a golpe, machaco a mi oponente hasta una sumisión sangrienta y conmocionada, clavándo[sc_loser.GetHerHim] en el suelo con toda la furia que [sc_victor.GetFaith.WarGodName] me puede dar.\n\nCuando todo lo que queda es un amasijo tembloroso en forma de [sc_loser.GetWomanMan] sangrante, me pregunto si he ido demasiado lejos. Entonces, [sc_loser.GetFirstNameNoTooltip] tose lo bastante fuerte como para perder el control de [sc_loser.Custom('signature_weapon')] y me permito un pequeño suspiro de alivio.\n\nDesaparecida la preocupación, pateo el arma de mi enemigo y pongo la mía contra su garganta. Hacen falta algunos intentos, pero [sc_loser.GetFirstNameNoTooltip] al final acierta a rendirse."

