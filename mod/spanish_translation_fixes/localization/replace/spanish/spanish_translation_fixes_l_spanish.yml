 # travel/battle_points_of_interest_l_spanish.yml
 BattlePoIHistoricalDescLechfeld:0 "#emp Vencedor: [GetScriptedCharacterByHistoryID( '1282' ).GetTitledFirstName]\nDerrotado: [GetScriptedCharacterByHistoryID( '460' ).GetFirstName] [GetScriptedCharacterByHistoryID( '460' ).GetDynastyName]\nFecha: 10 de agosto de 955 d. C.#!\n#weak Una batalla brutal entre las fuerzas del rey sajón Otto y las fuerzas húngaras. Tras unas pérdidas abrumadoras para ambos bandos, los húngaros huyeron cuando estuvieron a punto de ser rodeados y vieron que el curso de la batalla se volvía en su contra.\n\nDespués de terminar la batalla, mucho de los comandantes húngaros fueron capturados y ejecutados, y se puso fin a la amenaza magiar contra Europa occidental.#!"
 BattlePoIHistoricalDescHastings:0 "#emp Vencedor: [GetScriptedCharacterByHistoryID( '140' ).GetFirstName] [GetScriptedCharacterByHistoryID( '140' ).GetDynastyName]\nDerrotado: [GetScriptedCharacterByHistoryID( '122' ).GetFullName]\nFecha: 14 de octubre de 1066 d. C.#!\n#weak La batalla de Hastings fue una de las muchas batallas claves en el ascenso de Guillermo al trono de Inglaterra. Obligado a luchar cuesta arriba, al ejército normando le costaba abrirse paso y en un punto hasta llegó a retroceder, pero Guillermo consiguió reorganizar un contraataque contra las tropas inglesas.\n\nSuperado por las fuerzas enemigas, Harold murió junto con sus hermanos [GetScriptedCharacterByHistoryID( '132' ).GetFirstNameNoTooltip] y [GetScriptedCharacterByHistoryID( '130' ).GetFirstNameNoTooltip], lo que dejó el trono inglés vacante.#!"
 BattlePoIHistoricalDescFeiRiver:0 "#emp Vencedor: Xie An - Jin\nDerrotado: Fu Jian - Antiguo estado Qin\nFecha: 383 d. C.#!\n#weak Esta batalla fue la culminación de una campaña extensa donde el antiguo estado Qin, tras haber unido a una serie de distintas tribus extranjeras, había tomado el control de una parte significativa de las tierras de Jin. Los ejércitos de Qin eran muy superiores en número a los de Jin, que presentaron batalla en el río Fei.\n\nEn el transcurso de la batalla, las fuerzas disciplinadas y bien entrenada de Jin pusieron en fuga a las tropas más numerosas, pero desorganizadas y desmotivadas del antiguo estado de Qin.\n\nLa derrota de las fuerzas Qin por unos Jin con solo unas pocas bajas cambió el equilibrio de poder y garantizó que el sur de China siguiera siendo independiente durante más de cien años.#!"

 # travel/tourism_destinations_l_spanish.yml
 building_vatapi_caves_01_destination_desc:0 "Construidas por la primera dinastía Chalukya, las [GetBuilding('vatapi_caves_01').GetName|l] se han excavado hasta convertirse en una impresionante formación de arenisca. En su interior se halla un mundo sumamente sagrado y silencioso. Una puerta triunfal conduce a los peregrinos hasta la cara monolítica de la montaña."
