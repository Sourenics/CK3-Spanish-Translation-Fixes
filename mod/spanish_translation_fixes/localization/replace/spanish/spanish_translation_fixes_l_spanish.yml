l_spanish:
 # Spanish Translation Fixes 1.0.0 - corrected copies of vanilla keys. Grouped by the vanilla file they come from.

 # activities/coronation_activity_l_spanish.yml
 coronation_events.0301.b.tooltip:0 "[second_candidate.GetFirstNameNoTooltip] será [second_candidate.Custom('ES_ElLa')] nuev[second_candidate.Custom('ES_OA')] oficiante de la ceremonia"

 # activities/coronation_events_1_l_spanish.yml
 coronation_events.1000.tyrant.desc:0 "Un[bard.Custom('ES_XA')] juglar, con la cara encendida en actitud de desafío, da un paso adelante y comienza una balada:\n\n«¡Contemplad [ROOT.Char.GetName], el Puño de Hierro!».\n\nCada estrofa está sazonada con alabanzas mordaces que resuenan por toda la sala. Aprieto los dientes mientras la melodía burlona va en aumento y describe mi reinado como nada más que una tiranía mezquina."

 # activities/tournament_activity_oltner_l_spanish.yml
 tournament_events.9004.desc:0 "«¡Vamos, #EMP [falconer_1.Custom('GetBirdName')|U]#!, más rápido!». Oigo la voz de un[falconer_1.Custom('ES_XA')] [falconer_1.GetWomanMan] que resuena por todo el recinto. Levanto la vista y veo una cosa minúscula que surca el cielo como un pequeño rayo negro. Pronto desciende en picado hacia una línea de meta.\n\n«¡Bah, debéis de haber hecho trampa! Vuestro pájaro no puede volar tan rápido, miradlo, ¡es [falconer_1.Custom('GetBirdInsult')]!», grita el enfadado perdedor, mientras [falconer_1.Custom('ES_ElLa')] ganador[falconer_1.Custom('ES_XA')] parece encantad[falconer_1.Custom('ES_OA')]."

 # ai_personality_l_spanish.yml
 rationality_explanation:0 "Este personaje es #Bold algo racional#! y es más probable que evite la [tyranny|lE], emplee [councillor_tasks|lE] para defenderse y eluda una [offensive_war_opinion|lE]. En general, es más probable que haga lo que sea objetivamente mejor para la situación en la que está, como asesinar a un [liege|lE] [tyrannical|lE], intercambiar [hostages|lE] para evitar una guerra o reducir gastos si incurre en [debt|lE]."

 # artifacts/artifacts_l_spanish.yml
 artifact_joyeuse_description:0 "La espada de Carlomagno, forjada para contener la lanza de Longinos. La Joyosa es un símbolo tanto de valor caballeresco como del legado real del imperio carolingio."

 # board_game_events_l_spanish.yml
 board_games.0001.desc.opponent_winning.trait.content:0 "«Qué partida más encantadora», gorjea mi contrincante. «No podríamos pedir nada mejor, ¿verdad? Aparte de vuestra suerte, claro»."

 # buildings_l_spanish.yml
 building_hagios_demetrios_desc:0 "La iglesia de san Demetrio es el santuario más importante de la ciudad.\nErigida por primera vez cuando la fe de Cristo aún era joven, incorpora los baños romanos donde el santo, junto con otros primeros creyentes, fue encarcelado, martirizado y enterrado."
 building_murex_farm_04_desc:0 "Un patio al aire libre acelera el proceso de oxidación del tinte, lo que reduce el tiempo de producción del tinte púrpura y garantiza un proceso de trabajo más eficiente."

 # contracts/laamp_base_learning_contract_events_l_spanish.yml
 laamp_base_learning_contract_events.4001.d.flavor.unwind:0 "Por qué hacer más cuando puedo hacer menos."

 # contracts/task_contracts_l_spanish.yml
 ep3_contract_event.0093.desc_taxes:0 "«Los diezmos son altos, ¡pero los pagamos! ¡Las cargas que abonamos por nuestros productos apenas nos dejan migajas! Soportamos estos pagos, pero [task_contract_councillor_liege.Custom('ES_ElLa')] [task_contract_councillor_liege.GetTitledFirstName|l] nos exige más aún, ¡mientras los recaudadores de impuestos son cada vez más ricos! ¡A #EMP ellos#! es a los que deberíais inquirir!»."
 ep3_contract_event.0095.a_2:0 "Solo los dirigiré en la guerra."

 # core_l_spanish.yml
 PIETY_WITH_BALANCE_TOOLTIP:0 "#T [piety|E]: $VALUE|V0$#!\n$BALANCE|V=1$/mes\n\n#T [piety_level|E]: #!$LEVEL$"

 # council_tasks_l_spanish.yml
 COUNCILLOR_IS_YOUR_FRIEND:0 "[councillor.GetCouncilTitle] [councillor.GetShortUIName] es amig[councillor.Custom('ES_OA')] tuy[councillor.Custom('ES_OA')]"

 # custom_localization/greeting_custom_loc_l_spanish.yml
 greeting_family_liked_plain:0 "Mi querid[second.Custom('ES_OA')] [ROOT.Char.Custom2('RelationToMeShort', second)],"
 greeting_foreign_ruler_negative:0 "[second.Custom('ES_AlAla')|U] [second.Custom2('InsultAdjective', ROOT.Char)] [second.GetTitledFirstNameNoTooltip|l],"

 # decisions_l_spanish.yml
 introduce_a_new_fashion_at_court_decision_desc:0 "¡Ninguna corte puede afirmar ser más elegante que la nuestra! La corte es un campo de batalla de moda y ya es momento de que lance mi propia ofensiva para imponer una nueva moda entre la nobleza…"
 bwow_fundementalist_tooltip:0 "Tu fe se volverá más fundamentalista y belicosa"
 form_brunei_kingdom_decision_effects_de_jure_tt_b:0 "Si se posee, [berau_county.GetNameNoTier] formará parte [de_jure|El] de [barune_duchy.GetName]"

 # dlc/ach/dlc_ach_coronation_prelude_events_l_spanish.yml
 prelude_events.0170.a.success:0 "El público queda impresionado"

 # dlc/ach/dlc_ach_yearly_events_l_spanish.yml
 ach_yearly_events.1003.desc:0 "El conflicto de mi señor[liege.Custom('ES_XA')] con [foe.GetPrimaryTitle.GetNameNoTier] se alarga. Al ejercer de [Concept( 'marshal', GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName )|l], planeo la logística, recluto a [liege.Custom('GetLocalCommonerTermPlural')] para el servicio, acallo el descontento local…, pero los jinetes traen noticias preocupantes.\n\nEn [battle_province.GetName], los [liege.Custom('KnightCulturePluralNoTooltip')|l] de [liege.GetPrimaryTitle.GetNameNoTier] han fracasado. Se rompió la línea de combate de [commander.GetName] y nuestro ejército se lanzó a una huida desesperada. ¡Con nuestros [liege.Custom('GetFighterTermPlural')] en fuga, la hueste de [foe.GetName] avanza hacia [liege.GetPrimaryTitle.GetTierAsNameNoTooltip]!\n\nMis consejeros me incitan a hacer honor a mi puesto, a tomar con mano de hierro las riendas de este desastre."

 # dlc/bp1/dlc_bp1_yearly_events_l_spanish.yml
 bp1_yearly.5708.start:0 "Paseo por un bullicioso callejón con mi amig[heathen_friend.Custom('ES_OA')] [heathen_friend.GetFirstName], cuando desaparece de repente. Me vuelvo y [heathen_friend.GetHerHim] veo enfrascad[heathen_friend.Custom('ES_OA')] en una discusión con un comerciante cuyas mercancías parecen consistir principalmente en curiosas baratijas. [heathen_friend.GetFirstNameNoTooltip|U], una vez completada su transacción, vuelve a acercarse a mí, acariciando su nueva compra sin prestar atención.\n\n"

 # dlc/bp2/dlc_bp2_yearly_2_l_spanish.yml
 bp2_yearly.2015.desc:0 "«¿Es que nunca me libraré de tal [bully.Custom2('InsultNoun', ROOT.Char)]?!», me lamento, con la cabeza gacha tras sufrir una nueva humillación pública por parte de [Select_CString( bully.IsFemale, 'la abusona', 'el abusón' )] de [bully.GetFirstName].\n\nMientras lágrimas cálidas corren por mi rostro, me sorprendo al sentir un toque suave en el hombro. Es mi amig[ROOT.Char.Custom('ES_OAOpp')], [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]. Siempre está ahí cuando [ROOT.Char.Custom('ES_LoLaOpp')] necesito.\n\n«Ya es hora de que te plantes ante es[bully.Custom('ES_EA')] horrible [bully.GetFirstNameNoTooltip]. Te sugiero empezar un rumor sobre lo que le gusta hacer con su [bully.Custom('child_favorite_toy')] cuando está a solas en sus aposentos…»."
 bp2_yearly.2022.desc.next_target:0 "«Pero no nos demoremos, aún hay más diversión por delante, [Select_CString( ROOT.Char.IsFemale, 'amiga querida', 'amigo querido' )]. [new_murder_target.GetFirstName] está #EMP list[new_murder_target.Custom('ES_OA')] para la matanza…#!»."

 # dlc/bp2/dlc_bp2_yearly_5_l_spanish.yml
 bp2_yearly.5053.b.success:0 "Te creen"
 bp2_yearly.5053.b.failure:0 "No te creen"

 # dlc/ep1/dlc_ep1_flavor_events_l_spanish.yml
 ep1_flavor.2040.desc.gold:0 "«Esta pieza sin par podría perteneceros, a un precio especial, por supuesto, gran [ROOT.Char.GetTitleAsNameNoTooltip|l]…».\n\n¡Un cuento, probablemente!"

 # dlc/ep1/dlc_ep1_game_concepts_l_spanish.yml
 game_concept_aptitude_desc:0 "La $game_concept_aptitude$ de un [character|lE] indica lo eficiente que es en distintos papeles de la [court|lE]. Estos incluyen [court_positions|lE], [diarchs|lE] y [tax_collectors|lE]\n\nLa $game_concept_aptitude$ se mide en cinco niveles, que van de Horrible a Excelente. El nivel de aptitud del personaje decidirá las bonificaciones que recibirá el [liege|lE] por darle empleo en su [court|lE].\n\nPor ejemplo, un personaje que sea [GetTrait('lifestyle_physician').GetName( GetNullCharacter )|l] estará mejor equipado para servir como $court_physician_court_position$, como es lógico."

 # dlc/ep2/dlc_ep2_locale_events_l_spanish.yml
 ep2_locale_events.2510.b:0 "No hay nada más útil que un gambesón."
 ep2_locale_events.3002.desc:0 "¿Qué es ese ruido? ¿Risas…? ¿Gemidos? #EMP Suena#! como si viniera de esa tienda.\n\nLa curiosidad me puede. Aparto la solapa de la tienda para encontrar… un espectáculo de lo más llamativo.\n\n[lech1.Custom('ES_ElLa')] [lech1.GetTitledFirstName|l], pillad[lech1.Custom('ES_OA')] totalmente #EMP in fraganti#!, entra en pánico y empuja a su acompañante lejos de [lech1.Custom('ES_ElElla')]. En la sudorosa penumbra de la tienda, yacen [lech2.Custom('ES_ElLa')] [lech2.GetTitledFirstName|l] y [lech3.Custom('ES_ElLa')] [lech3.GetTitledFirstName|l] también, desenredándose apresuradamente de los cuerpos desnudos y corpulentos de sus amantes."

 # dlc/ep2/tournament/dlc_ep2_contest_events_l_spanish.yml
 contest_events.1540.desc:0 "Recojo una flecha con confianza, ocupando mi lugar ante la diana y sintiendo el ambiente. La multitud calla mientras perfecciono mi postura y enfoque.\n\nEl primer tiro falla por un pelo, incrustándose en la tierra del campo. El segundo silba a kilómetros por encima de la diana. El tercero cae a pocos metros de mí, disparado por una mala suelta.\n\n"
 contest_events.1541.desc:0 "[contestant.Custom('ES_ElLa')|U] [contestant.GetTitledFirstName|l] recoge una flecha con confianza, ocupando su lugar ante la diana y sintiendo el ambiente. La multitud calla mientras perfecciona su postura y enfoque.\n\nEl primer tiro falla por un pelo, incrustándose en la tierra del campo. El segundo silba a kilómetros por encima de la diana. El tercero cae a pocos metros de [contestant.GetSheHe], disparado por una mala suelta.\n\n"

 # dlc/ep2/tournament/dlc_ep2_tournament_l_spanish.yml
 tournament_champion_qualify_desc:0 "Tu campe[contest_champion.Custom('ES_OnOna')], [contest_champion.Custom('ES_ElLa')] [contest_champion.GetTitledFirstName|l], se unió a la competición de [activity.GetCurrentPhase.GetPhase.GetName|l] de [host.GetShortUIName]"
 tournament_champion_qualify_multi_desc:0 "Tu campe[contest_champion.Custom('ES_OnOna')], [contest_champion.Custom('ES_ElLa')] [contest_champion.GetTitledFirstName|l], y [qualification_liege.MakeScope.Var('qualified_knights_count').GetValue|0V] de tus $knight_culture_player_plural_no_tooltip_lowercase$ se unieron a la competición de [activity.GetCurrentPhase.GetPhase.GetName|l] de [host.GetShortUIName]"
 tournament_champion_qualify_fail_desc:0 "Tu campe[contest_champion.Custom('ES_OnOna')], [contest_champion.Custom('ES_ElLa')] [contest_champion.GetTitledFirstName|l], no se clasificó para la competición de [activity.GetCurrentPhase.GetPhase.GetName|l] de [host.GetShortUIName]"

 # dlc/ep2/wedding/ep2_wedding_events_l_spanish.yml
 ep2_wedding.9015.tt:0 "[ROOT.Char.GetUIName|U] [ROOT.Char.LocalPlayerString( 'has', 'ha' )] recibido un reembolso por la [GetActivityType('activity_wedding').GetName|l] cancelada de [THIS.Var('gwedding_gold_recoup_value').GetValue|V0] [gold_i]"

 # dlc/ep3/dlc_ep3_camp_party_l_spanish.yml
 ep3_camp_party.2000.compassionate:0 "ayudar a los necesitados #EMP es#! la recompensa en sí misma"

 # dlc/ep3/dlc_ep3_decisions_l_spanish.yml
 refound_pandidakterion_decision_desc:0 "El emperador [GetScriptedCharacterByHistoryID( '70533' ).GetFirstName] fundó el [Glossary( 'Pandidakterion', 'PANDIDAKTERION_GLOSS' )] el año 425 d.C., uno de los mayores centros de conocimiento del mundo. Muchos siglos han pasado desde entonces y los tiempos han cambiado. Si queremos que el Pandidakterion siga estando a la vanguardia del conocimiento, hay que renovar y reorganizar esta institución."

 # dlc/ep3/ep3_governor_yearly_3_l_spanish.yml
 ep3_governor_yearly.3001.b:0 "Mejor prosperar yo un poco que un[governor.Custom('ES_XA')] [governor.GetTitleAsNameNoTooltip|l] imbécil."

 # dlc/ep3/ep3_laamp_decision_events_l_spanish.yml
 ep3_laamp_decision_event.1040.desc_outro_return_01:0 "\n\nEn un rincón sombreado de la plaza, un charlatán intenta convencer a un[ROOT.Char.Custom('ES_XA')] noble de las propiedades curativas de la arena roja.\n\nObservo indiferente su discusión mientras pienso en cuál será mi próximo movimiento."

 # dlc/ep3/ep3_modifiers_l_spanish.yml
 ep3_sent_help_to_east_modifier:0 "Ejército enviado en ayuda"

 # dlc/ep3/ep3_schemes_l_spanish.yml
 depose_desc_general:0 "En una conjura de derrocamiento, conspiras para destronar al emperador y sustituirlo por un candidato más adecuado: #EMP tú.#!"
 subsume_province_recipient_scheming_against_you_tt:0 "[recipient.GetShortUIName] ya intenta subsumir tu [governorship|lE]"
 coronation_spouse_despised_modifier:0 "Promesa de coronación de [Select_CString( owner.IsLocalPlayer, 'tu persona', owner.GetShortUIName)] de librarse de [Select_CString(target.IsLocalPlayer,'ti', target.GetShortUIName)]: $VALUE|+=0$"

 # dlc/fp1/dlc_fp1_yearly_events_oltner_l_spanish.yml
 fp1_yearly.2400.desc:0 "La naturaleza me llama. Ha llovido mucho desde mi última cacería. Fuera, en [ROOT.Char.Custom('TerrainType')] de [hunting_province.GetName], hay [ROOT.Char.Custom('GetAnimalPlural')] de carácter [ROOT.Char.Custom('GetAnimalAdjective')]. ¡Un ejemplar quedaría de lujo en la cena de esta noche!\n\nPero me falta algo. ¿Mis lanzas de caza están viejas y romas? ¿O necesito un acompañante?\n\nDebo asegurarme de prepararme bien."

 # dlc/fp2/dlc_fp2_events_amalgamated_l_spanish.yml
 fp2_yearly.1006.desc:0 "Me paro ante un puesto de la carretera donde venden comidas sencillas. Su comerciante, [cheese_trader.GetName], me sirve distintos productos antes de agacharse bajo el mostrador y sacar una caja de madera tallada.\n\n«Para vos, mi señor[ROOT.Char.Custom('ES_XA')], este es el mejor queso de todo el señorío», me pone el taco en la mano, se inclina hacia mí y susurra en tono conspiratorio. «Lo hicieron unos vikingos queseros aquí, en Iberia».\n\nPese al extraño comentario, el queso está increíblemente bueno."
 fp2_yearly.1008.desc:0 "Ha llegado el momento. En lo profundo de la despensa descansa el queso más increíble del mundo conocido, curándose lentamente, potenciando su sabor.\n\n Y ahora, lo consumiré."
 fp2_yearly.8004.c:0 "Las bibliotecas son un verdadero fastidio…"

 # dlc/fp3/dlc_fp3_decision_events_l_spanish.yml
 fp3_decision.0009.desc:0 "[founder.GetFirstName] se ha propuesto reclamar la responsabilidad del [founder.GetFaith.ReligiousHeadName] para los [founder.GetFaith.GetAdherentNamePlural] y se ve que muchos de sus partidarios apoyan este audaz movimiento. Dicen que posee el #italic weyalat#!, la guía mística de [ROOT.Char.GetFaith.HighGodNameAlternate] que le permite dirigir a los fieles. Aunque puede que yo no esté en posición de desafiar directamente esta reivindicación, como una de las figuras principales del [founder.GetFaith.GetNameNoTooltip|l], mi posición importará. ¿Debo aceptar[founder.GetHerHim] como nuev[founder.Custom('ES_OA')] líder de los fieles u oponerme discretamente a [founder.GetSheHe]?"

 # dlc/fp3/dlc_fp3_decisions_l_spanish.yml
 fp3_sunder_the_caliphate_same_faith_vassal_hook_tt:0 "[sunderer.GetShortUIName|U] [Select_CString( sunderer.IsLocalPlayer, 'conseguirás', 'conseguirá' )] un [weak_hook|lE] #weak ($favor_hook$)#! sobre ellos"
 struggle_persia_ending_rekindle_iran_decision_region_control_tt:0 "Controlas al menos un #Z [SCOPE.ScriptValue('fp3_persia_owned_for_rekindle_persia_percent_value')|0] %#! del #L #high [GetTitleByKey('e_persia').GetNameNoTier]#!#! (ahora: #Z [SCOPE.ScriptValue('fp3_iranian_current_owned_persia_value')|0] %#!)"

 # dlc/mpo/mpo_interactions_l_spanish.yml
 DEMAND_OBEDIENCE_INTERACTION_HERD_ACCEPTANCE:0 "[recipient.GetSheHe|U] tiene una [herd|lE] mayor que la tuya: $VALUE|=+0$"
 DEMAND_OBEDIENCE_INTERACTION_MILITARY_MIGHT_ACCEPTANCE:0 "[recipient.GetSheHe|U] tiene un [army|lE] más fuerte que tú: $VALUE|=+0$"

 # dlc/pam/pam_character_interactions_l_spanish.yml
 pam_interactions_events.0097.a:0 "[target.GetNameNoTierNoTooltip] me pertenece y debo responder por ello."
 filial_piety_request_child_gold_notification:0 "[actor.GetShortUIName] te pide, como [ROOT.Char.Custom('GetDaughterSon')] suy[ROOT.Char.Custom('ES_OA')], apoyo financiero."

 # dlc/pam/pam_christian_situation_events_l_spanish.yml
 pam_the_christian_church.0057.desc.eastern:0 "Seguimos cantando plegarias mientras los escritorios occidentales crujen bajo tratados pesados. La armonía es bien recibida, pero sus disputas académicas no deberían entrar en nuestras cancillerías."

 # dlc/pam/pam_clergy_events_l_spanish.yml
 pam_clergy_events.0010.desc.intro:0 "Como [cardinalate.GetHolder.GetTitleAsNameNoTooltip|l], soy una extensión de la voluntad [actor.Custom('ES_DelDela')] sant[actor.Custom('ES_OA')] [actor.GetMotherFather].\n\n"
 pam_clergy_events.0060.desc.hof_outro:0 "Reyes y emperadores no son más que niños a la sombra de la voluntad de su sant[new_prelate.Custom('ES_OA')] [new_prelate.GetMotherFather]. Un ejército de [new_prelate.GetFaith.BishopMalePlural] ahora está a las órdenes de un[new_prelate.Custom('ES_XA')] [new_prelate.GetDynasty.GetNameNoTooltip]."

 # dlc/pam/pam_decisions_l_spanish.yml
 pam_mended_great_schism_military_dynasty_modifier_desc:0 "Esta dinastía ha reunido las antiguas sedes bajo un único estandarte y ha sanado la ruptura en el mundo cristiano por la fuerza de las armas."

 # dlc/pam/pam_generic_events_l_spanish.yml
 pam_generic_events.0004.desc:0 "El recinto de [ROOT.Char.GetFaith.HouseOfWorship] está completamente vacío. Una neblina se alza en espiral entre las columnas y las velas parpadean en torno al recuerdo de mi [ROOT.Char.Custom2( 'RelationToMeShort', deceased )], [deceased.GetFirstName], que [deceased.GetDeathReasonHideKiller].\n\nMi [ROOT.Char.Custom2( 'RelationToMeShort', comforter )], [comforter.GetFirstName], se sienta tan cerca que su manga roza la mía. «El duelo es un camino», dice con dulzura. «Recorredlo y tal vez encontréis [ROOT.Char.GetFaith.PositiveAfterLife] al final»."

 # dlc/pam/pam_secular_faith_events_l_spanish.yml
 pam_secular_faith_events.0024.a:0 "¡Y es así como [ROOT.Char.GetFaith.HighGodName] recibe a [Select_CString(rival_character.IsFemale, 'otra servidora', 'otro servidor' )] «dispuest[rival_character.Custom('ES_OA')]»!"

 # dlc/pam/pam_theocratic_ruler_events_l_spanish.yml
 pam_theocratic_ruler_events.0002.desc:0 "Se me informa de que [foreign_ruler.Custom('ES_ElLa')] [foreign_ruler.GetTitledFirstName|l], vecin[foreign_ruler.Custom('ES_OA')] y seguidor[foreign_ruler.Custom('ES_XA')] de las antiguas tradiciones del [foreign_ruler.GetFaith.GetName|l], ha entrado en mis tierras.\n\nEl pequeño séquito tiene otro destino, pero su ruta [foreign_ruler.GetHerHim] trae tan cerca que se espera que [foreign_ruler.GetHerHim] reciba formalmente en mi corte. \n\n¿Cómo he de recibirle?"
 pam_theocratic_ruler_events.0002.b.success:0 "Mi cortesía se los gana"

 # dlc/pam/pam_triggers_l_spanish.yml
 uses_doctrine_first:0 "El [Faith.GetName|l] sigue la [doctrine|El] [DoctrineType.GetDescriptiveName( Faith.Self )|l]"

 # dlc/tgp/dlc_tgp_ceremonial_liege_events_l_spanish.yml
 tgp_ceremonial_liege_events.0040.desc:0 "«Disculpad, [inquirer.Custom2('RelationToMeShort', ROOT.Char)] mí[inquirer.Custom('ES_OA')]», susurra [inquirer.GetName] en voz baja mientras se me acerca.\n\n«Llevo un tiempo reflexionando sobre esto y, perdonadme si es inapropiado», dice, «pero ¿por qué no os libráis de [opposing_power.GetFirstName]? ¡No parece digno de un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetTitleAsNameNoTooltip|l] ser titiriter[ROOT.Char.Custom('ES_OA')] de un[opposing_power.Custom('ES_XA')] vulgar [opposing_power.GetTitleAsNameNoTooltip|l]!»."

 # dlc/tgp/dlc_tgp_china_decisions_l_spanish.yml
 noble_family_domicile_buildings_converted:0 "Los [buildings|lE] del [domicile|lE] de [Select_CString( former_noble_family_head.IsLocalPlayer, 'tu personaje', former_noble_family_head.GetShortUIName )] se cambian por [gold|lE] [gold_i]"

 # dlc/tgp/dlc_tgp_governance_l_spanish.yml
 tgp_governor_contract_event.0029.a:0 "Que se haga una proclamación publica que [seditious_storyteller.GetHerHim] condene por perturbar el orden público."

 # dlc/tgp/dlc_tgp_situation_decision_events_l_spanish.yml
 tgp_dynastic_cycle.0061.t:0 "[GetTitleByKey('h_china').GetHolder.Custom('ES_ElLa')|U] [GetTitleByKey('h_china').GetHolder.Custom('GetDaughterSon')] preferid[GetTitleByKey('h_china').GetHolder.Custom('ES_OA')] del Cielo"
 tgp_dynastic_cycle.0062.desc.interloper:0 "Al tiempo que la fortuna otorgada a un[GetTitleByKey('h_china').GetHolder.Custom('ES_XA')] [GetTitleByKey('h_china').GetHolder.GetWomanMan] decae, la de otra persona aumenta y ni reyes ni emperadores son inmunes a los caprichos del destino.\n\n[GetTitleByKey('h_china').GetHolder.Custom('ES_ElLa')|U] [GetTitleByKey('h_china').GetHolder.GetTitledFirstName|l] ha reclamado el Mandato del Cielo y se espera que todos se postren a los pies [GetTitleByKey('h_china').GetHolder.Custom('ES_DelDela')] nuev[GetTitleByKey('h_china').GetHolder.Custom('ES_OA')] soberan[GetTitleByKey('h_china').GetHolder.Custom('ES_OA')]."

 # dlc/tgp/dlc_tgp_situation_parameters_l_spanish.yml
 SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA:0 "China entra en esta $game_concept_dynastic_cycle_era_short$ desde cualquier [dynastic_cycle_era_type_unstable|lE] si se desencadenan bastantes [situation_catalyst_catalysts|lE]."
 is_any_movement_leader_tt_global:0 "[CHARACTER.GetShortUIName|U] [CHARACTER.LocalPlayerString( 'eres', 'es' )] [movement_leader|lE]"
 is_any_movement_leader_tt_global_not:0 "[CHARACTER.GetShortUIName|U] #bold no#! [CHARACTER.LocalPlayerString( 'eres', 'es' )] [movement_leader|lE]"
 make_movement_leader_effect_desc_first:0 "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'te conviertes', 'se convierte')] en [movement_leader|lE] del [SITUATION_PARTICIPANT_GROUP.GetName]"
 make_movement_leader_effect_desc_third:0 "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'te conviertes', 'se convierte')] en [movement_leader|lE] del [SITUATION_PARTICIPANT_GROUP.GetName]"
 make_movement_leader_effect_desc_global:0 "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'te conviertes', 'se convierte')] en [movement_leader|lE] del [SITUATION_PARTICIPANT_GROUP.GetName]"

 # dlc/tgp/tgp_china_government_l_spanish.yml
 celestial_government_desc:0 "\n$game_concept_celestial_government_desc$\n\n#F El sistema $celestial_government$ hace referencia al gobierno administrativo centralizado de China, supervisado por el Hijo del Cielo.#!"

 # dlc/tgp/tgp_east_asia_decision_events_l_spanish.yml
 tgp_east_asia_decision_events.0020.desc:0 "He visto las señales. Sé lo que es correcto. No hay realidad en la cual no pueda apoyar [overlord.Custom('ES_AlAla')] [overlord.GetTitledFirstName|l] y su gobierno benévolo sobre este plano de la existencia.\n\nNos adaptaremos y seguiremos a [Select_CString(overlord.IsFemale, 'nuestra divina pastora', 'nuestro divino pastor' )] hacia un futuro brillante.\n\n#EMP Salve, devaraja [overlord.GetFirstNameNoTooltip].#!"

 # dlc/tgp/tgp_genpei_character_events_l_spanish.yml
 tgp_genpei_character.1010.desc.intro:0 "¡[kiyomori_taira.GetFirstName]! Su deseo de poder es un río que discurre sin control y arrasa la tradición noble y la propiedad por igual. Ni hacerse llamar [kiyomori_taira.GetTitleAsName|l], señor[kiyomori_taira.Custom('ES_XA')] de todo Japón, sacia su ansia disoluta. Embriagad[kiyomori_taira.Custom('ES_OA')] con el dominio indiscutido de los [Glossary( 'Taira', 'TAIRA_GLOSS' )], ha visto apropiado deponer [old_emperor.Custom('ES_AlAla')] [Glossary( 'tennō', 'TENNO_GLOSS' )] [old_emperor.GetTitledFirstName|l] del [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l] y poner en él a su niet[new_emperor.Custom('ES_OA')], [new_emperor.GetFirstName]."

 # dlc/tgp/tgp_imperial_examination_emperor_events_l_spanish.yml
 emperor_imperial_examination.200.desc:0 "«Vuestra estimada majestad», dice reverente mi [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.Custom('ES_ElLa')] [examination_character_2.GetTitledFirstName|l]. «Durante mis viajes por [concubine_origin.GetNameNoTier], conocí a una familia de buena posición, los [examination_character_1.GetHouse.GetName], y hablé con los ancianos de la comunidad [examination_character_1.GetCulture.GetName]».\n\n«Me solicitaron que eligiera a un[examination_character_1.Custom('ES_XA')] [examination_character_1.GetLadyLord] para que os sirviera en el palacio interior. Elegí a [examination_character_1.GetFirstName], un[examination_character_1.Custom('ES_XA')] [examination_character_1.GetWomanMan] de gracia inusual. Esperamos que os agrade, oh, [ROOT.Char.Custom('GetDaughterSon')|U] del Cielo»."
 emperor_imperial_examination.300.desc:0 "«Gran [ROOT.Char.GetTitleAsNameNoTooltip|l], inmensa es vuestra docta gracia». Mi [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.Custom('ES_ElLa')] [examination_character_2.GetTitledFirstName|l], se postra ante mí. «Traigo una humilde ofrenda, un artefacto que exhibir en el palacio».\n\n«Este objeto, [newly_created_artifact.GetName], es una reliquia de la casa [examination_character_2.GetHouse.GetName]. No pedimos más que vuestra soberana majestad nos reconozca como servidores leales»."
 emperor_imperial_examination.600.desc:0 "Cuando observaba a la multitud, un[examination_character_2.Custom('ES_OA')] de los examinandos, [examination_character_2.Custom('ES_ElLa')] [examination_character_2.GetTitledFirstName|l], está tan embobad[examination_character_2.Custom('ES_OA')] contando chistes que apenas se da cuenta de dónde va. Andando hacia atrás lentamente, se acerca a mí sin querer: «… ¡y así fue como su [examination_character_2.Custom('GetAdventureNameBand')|l] se quedó sin [examination_character_2.Custom('GetAdventureNameSuffix')|l]!».\n\nToso ligeramente.\n\nLa gente delante de [examination_character_2.Custom('ES_ElElla')] queda en silencio. [examination_character_2.GetFirstNameNoTooltip] se paraliza por el miedo."

 # dlc/tgp/tgp_imperial_examination_events_l_spanish.yml
 imperial_examination.4060.desc_learning:0 "Debato con mis iguales en la pensión cuando una voz nasal insoportable interrumpe mi argumento diciendo: «Esa es una idea básica ¡y una muy discutible, ya que estamos!».\n\nMe giro para mirar a quien lo ha dicho, un[promising_lowborn.Custom('ES_XA')] don nadie advenediz[promising_lowborn.Custom('ES_OA')] de [ROOT.Char.GetCurrentLocation.GetName]. Lleva una hora mofándose y poniendo los ojos en blanco con cada palabra que digo. \n\nCuanto menos respondo a los insultos, más se burlan de mí los otros eruditos."
 imperial_examination.4060.a.success:0 "Dejas en ridículo [promising_lowborn.Custom('ES_AlAla')] advenediz[promising_lowborn.Custom('ES_OA')]"
 imperial_examination.4070.a.failure:0 "Los planes de tu [parent.GetMotherFather] se han desvelado"

 # dlc/tgp/tgp_mandala_scheme_events_l_spanish.yml
 scheme_critical_moments.1215.a_discovered:0 "¡Maldit[owner.Custom('ES_OA')] [owner.Custom2('InsultNoun', ROOT.Char)]!"
 scheme_potential_suzerain_might_join_war_tt:0 "\n@alert_icon! #alert_trial ¡[CHARACTER.GetShortUIName] [Select_CString( CHARACTER.IsLocalPlayer, 'puedes', 'puede' )] convertir[Select_CString( CHARACTER.IsLocalPlayer, 'te', 'se' )] en [Concept('suzerain',Select_CString(CHARACTER.IsFemale,'soberana', 'soberano'))|E] de [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'tu personaje', TARGET_CHARACTER.GetShortUIName)] y [Select_CString( CHARACTER.IsLocalPlayer, 'puedes', 'puede' )] unir[Select_CString( CHARACTER.IsLocalPlayer, 'te', 'se' )] a la guerra como defensor!#!"

 # dlc/tgp/tgp_mandala_task_contracts_l_spanish.yml
 mandala_realm_contract_0011_desc:0 "Un relámpago ha caído sobre un árbol sagrado y ha calcinado la arboleda que lo rodeaba en [TaskContract.GetLocation.GetNameNoTooltip]. Los campesinos están asustados y te piden que realices un rito de fertilidad bajo el árbol."

 # dlc/tgp/tgp_movement_events_l_spanish.yml
 friend_same_movement_reason:0 "[CHARACTER.GetShortUIName|U] y [TARGET_CHARACTER.GetShortUIName] [Select_CString(Or(CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer), 'acordasteis', 'acordaron')] tener en cuenta sus respectivos intereses como integrantes del mismo movimiento."
 tgp_movement_events.0040.desc:0 "«Vuestro trabajo no ha pasado desapercibido, [ROOT.Char.GetTitledFirstNameNoTooltip|l]». Una voz tranquila dice mi nombre. [courtier.Custom('ES_ElLa')|U] [courtier.GetWomanMan] que se inclina ante mí lleva el sello [hegemon.Custom('ES_DelDela')] [hegemon.GetTitledFirstNameNoTooltip|l].\n\n«[hegemon.Custom('ES_ElLa')|U] [hegemon.GetTitledFirstName|l] agradece vuestro apoyo y desea recompensaros por ello. El [my_movement.GetName] será ensalzado en los pasillos de palacio, y vuestros nombres, recordados»."

 # dlc/tgp/tgp_tribute_mission_events_l_spanish.yml
 tribute_mission.1002.personality.cynical:0 "\n\nUn temblor en el rabillo del ojo, al tiempo que sus brazos adoptan una postura defensiva, indica que est[human_tribute.Custom('ES_EA')] [human_tribute.GetWomanMan] tiene una opinión muy particular del mundo."
 tribute_mission.1005.t.bunga_mas:0 "$tribute_mission_header$ las flores de oro [tributary_scope.Custom('ES_DelDela')] [tributary_scope.GetTitledFirstNameNoTooltip|l]"

 # effects_l_spanish.yml
 THEY_GET_TITLE:0 "[CHARACTER.GetShortUIName|U] gana el [title|lE] de [TARGET_TITLE.GetDefinitiveName|V]"
 gracious_host_impeccable_guest_perk_3_effect:0 "[adventurer_i] [modifiers|E] extra por el [camp_temperament|lE] #P $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_POSITIVE$#! que ahora también escala por el número de [languages|lE] conocidos"

 # event_localization/accolade_events_l_spanish.yml
 accolade_find_successor_fail_notification_tooltip:0 "La búsqueda de un $knight_culture_player_no_tooltip_lowercase$ que pueda convertirse en [accolade_in_need.GetName] ha demostrado ser infructuosa."

 # event_localization/activities/az_tour_events_l_spanish.yml
 az_tour.1006.desc.b:0 "«Trabajamos duro en el campo, ¡pero todo el dinero se va en sedas y banquetes! Os sentáis bajo farolillos bebiendo [stop_host_scope.Custom('RegionalDrink')], pero ¿quién se preocupa por quienes tienen el cuenco vacío?».\n\n[stop_host_scope.GetSheHe|U] sonríe con lentitud e indulgencia. «Vuestros cuencos no me conciernen. ¡Guardias, apresad a est[angry_farmer.Custom('ES_EA')] [angry_farmer.Custom2('InsultNoun', ROOT.Char)]!». Gritos de asombro se elevan sobre la multitud cuando los guardias de [stop_host_scope.GetFirstName] arrestan [angry_farmer.Custom('ES_AlAla')] granjer[angry_farmer.Custom('ES_OA')] y se l[angry_farmer.Custom('ES_OA')] llevan; poco a poco, sus improperios desaparecen entre el sonido de la música."

 # event_localization/activities/coronation_events_l_spanish.yml
 ach_coronation.0013.desc_conversation.nice.5:0 "«¡Muerte a ese gusano [claimant.Custom('InsultAdjectiveGeneric')] pretendiente, [claimant.Custom('ES_ElLa')] [claimant.GetTitledFirstName|l]!», proclama un[peasant.Custom('ES_XA')] [peasant.Custom2('dummy_peasant_profession', peasant)|l] con un coro de vítores, «¡Viva [Select_CString( host.IsFemale, 'la legítima', 'el legítimo' )] [host.GetTitleAsNameNoTooltip]!»."

 # event_localization/activities/feast_events_l_spanish.yml
 feast.7110.desc.entourage:0 "La luz de las velas hace que la sangre parezca un tapiz de terciopelo, extendido por el suelo. Vuelvo a respirar cuando veo [Select_CString( my_knight.IsFemale, 'a la última', 'al último' )] de mi hueste de $knight_culture_player_plural_no_tooltip_lowercase$ limpiar su espada y asentir en silencio hacia mí.\n\nHago una señal a un[my_knight.Custom('ES_OA')] de mis [my_knight.GetWomenMen] para que cierre las puertas. Me despido de los invitados, «Es una verdadera lástima…»."
 feast_events_flavor.0001.desc.bad:0 "«Mi apreciad[relation_target.Custom('ES_OA')] [guest.Custom2('RelationToMeShort', SCOPE.sC('relation_target'))] [relation_target.GetFirstName] me dice que sois un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetWomanMan] de espíritu #EMP [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('relation_target'))]#!. Confío en que los rumores sean falsos y que todo haya sido un simple malentendido»."

 # event_localization/activities/festival_events_l_spanish.yml
 friend_invited_priestess_corresponding:0 "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'fuiste', 'fue')] invitad[CHARACTER.Custom('ES_OA')] a la corte de [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'tu personaje', TARGET_CHARACTER.GetShortUIName )] tras ver [Select_CString(CHARACTER.IsLocalPlayer, 'tu', 'su')] actuación impresionante en un festival."
 festival.019.desc:0 "Mi administrador[play_planner.Custom('ES_XA')], [play_planner.GetFirstName], se inclina respetuosamente ante mí. «Ha de haber una obra de teatro, [ROOT.Char.Custom('FormOfAddressForLiege')]», dice. «Pero la elección de la historia es vuestro privilegio». ¿Será algo que entretenga al pueblo o que le recuerde cuál es su lugar?"
 edified_a_child:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'impartiste', 'impartió' )] sabiduría a una mente joven."
 ate_well:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'te atiborraste', 'se atiborró' )] de manjares sabrosos."
 wished_for_prosperity:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'deseaste', 'deseó' )] prosperidad para todos."
 wished_for_vigor:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'deseaste', 'deseó' )] vigor y fortaleza."
 listened_to_chaplain:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'escuchaste', 'escuchó' )] una lección sobre lo divino."
 talked_down_chaplain:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'terminaste', 'terminó' )] diplomáticamente con una diatriba."
 delegated_ritual:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'presidiste', 'presidió' )] un rito con dignidad."
 served_with_humility:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'cumpliste', 'cumplió' )] con [Select_CString( CHARACTER.IsLocalPlayer, 'tu', 'su' )] papel con humildad."
 fought_for_fortune:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'participaste', 'participó' )] en una competición para ganar el favor de la fortuna."
 observed_dance:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'admiraste', 'admiró' )] un baile con elegancia y gracia."
 spied_on_wishes:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'conseguiste', 'consiguió' )] entender la oscuridad de los corazones ajenos."
 demanded_compensation_for_mishap:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'sacaste', 'sacó' )] una compensación de un torpe descuidado."
 forgave_mishap:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'perdonaste', 'perdonó' )] con gracia la torpeza de otro."
 burned_puppets:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'demostraste', 'demostró' )] las consecuencias de burlarse de los superiores."
 observed_crowd:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'conseguiste', 'consiguió' )] entender los corazones de [Select_CString( CHARACTER.IsLocalPlayer, 'tu', 'su' )] pueblo."
 ejected_priestess:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'dudaste', 'dudó' )] de la autenticidad de una petición divina."
 made_offering:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'hiciste', 'hizo' )] una ofrenda a los espíritus."
 planned_play:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'organizaste', 'organizó' )] una obra en [Select_CString( CHARACTER.IsLocalPlayer, 'tu', 'su' )] beneficio."
 competed_in_archery:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'osaste', 'osó' )] participar en una competición de tiro con arco."
 gained_lucky_fan_fragment:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'obtuviste', 'obtuvo' )] un fragmento de buena fortuna."
 banished_demons:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'desterraste', 'desterró' )] personalmente a unos «demonios» portadores de antorchas."
 banned_brawling:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'prohibiste', 'prohibió' )] una competición de fuerza y reforzó [Select_CString( CHARACTER.IsLocalPlayer, 'tu', 'su' )] autoridad."
 keen_eye_for_business:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'te aprovechaste', 'se aprovechó' )] de una oportunidad de lucro."
 rewarded_brawlers:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'ofreciste', 'ofreció' )] una recompensa material a los más fuertes."
 paraded_troops:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'organizaste', 'organizó' )] una demostración de fuerza."
 studied_martial_motions:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'obtuviste', 'obtuvo' )] conocimiento marcial."
 village_draft:0 "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'reclutaste', 'reclutó' )] a los más fuertes para que le sirvieran."

 # event_localization/activities/hunt_events_l_spanish.yml
 hunt.1015.desc:0 "«¡¿[ROOT.Char.GetTitledFirstNameNoTooltip]?! ¡Argh! ¿Sois vos, [ROOT.Char.Custom('FormOfAddressForLiege')]?».\n\nLa mirada desencajada [murder_target.Custom('ES_DelDela')] [murder_target.GetTitledFirstName|l] va del arco en mi mano a la flecha alojada en su brazo.\n\n«¡¿En qué estabais pensando?!»."
 hunt.1081.c.rival:0 "¡Maldit[murderer.Custom('ES_OA')] [murderer.Custom2('InsultNoun', ROOT.Char)]!"
 hunt.4900.befriend:0 "\n\nLe tiendo la mano con calma. El animal se relaja, confundido, antes de detenerse vacilante justo fuera de alcance, olfateando mis dedos con desconfianza."
 hunt.9001.spoils:0 "\n\nDejamos la parte de los despojos que corresponde a los ansiosos perros en la piel estirada, antes de partir hacia el campamento y nuestro hogar."
 mpo_hunt.0050.a:0 "[Select_CString(hunter.IsFemale, 'Esta cazadora', 'Este cazador' )] pertenece a mis [ROOT.Char.GetDomicile.GetCulture.GetCollectiveNounNoTooltip]."

 # event_localization/activities/petition_liege_events_l_spanish.yml
 petition_liege.0601.desc.liege_imprisoned_me:0 "$petition_liege.0601_shared_intro$ ¡Acabé capturando [petition_liege.Custom('ES_AlAla')] [petition_liege.GetTitledFirstName|l]!"

 # event_localization/activities/pilgrimage_events_l_spanish.yml
 pilgrimage.3301.c:0 "Sí, pero va contra el rito que un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetTitleAsNameNoTooltip] viaje austeramente."
 pilgrimage.4002.desc:0 "Por fin estoy aquí, en cuerpo y alma, al final de mi gran peregrinación. ¿Y a quién debería encontrar aquí sino [2010_mystic.Custom('ES_AlAla')] [2010_mystic.GetTitledFirstName|l], buscador[2010_mystic.Custom('ES_XA')] del verdadero conocimiento de lo divino?\n\n«¡Mirad en torno a vos, [ROOT.Char.GetFirstNameNoTooltip]!», dice. «¿No es esta gloria como dije que sería?»."
 pilgrimage.5401.desc:0 "He llegado al lugar más sagrado del mundo para los budistas, Bodh Gaya es el lugar donde [ROOT.Char.GetFaith.HighGodName] en persona consiguió la iluminación bajo el bodhi.\n\nDesde entonces, se levantó el decorado templo de MahSince en torno al árbol sagrado y peregrinos de todo el mundo acuden aquí para saber más de la historia [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] y conmemorar su vida."

 # event_localization/activities/tour_events_dan_l_spanish.yml
 tour_travel.3002.desc:0 "«Mi [widow_peasant.Custom2( 'RelationToMeShort', widow_father )], mi [widow_peasant.Custom2( 'RelationToMeShort', widow_husband )], mi [widow_peasant.Custom2( 'RelationToMeShort', widow_son )], todos murieron en #EMP vuestra guerra#!». Una campesina me grita al otro lado de la plaza del pueblo.\n\n«Cuando [battle_memory.GetSecondPerspectiveDescription], fue una victoria para vos, pero para mí fue el día en que murieron tres generaciones de mi familia».\n\nSu ira se había convertido en lágrimas y las palabras que pronunció a continuación apenas llegaron a mis oídos.\n\n«¡Vos no sois mi [ROOT.Char.GetTitleAsNameNoTooltip|l]!»."

 # event_localization/court_events/01_court_events_ep3_l_spanish.yml
 court.8197.desc:0 "Mi [position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('travel_leader_court_position').GetName()|l], [position_holder.Custom('ES_ElLa')] [position_holder.GetTitledFirstName|l], es [Select_CString(position_holder.IsFemale, 'una organizadora', 'un organizador' )] magistral: ¡desde que [position_holder.GetHerHim] contraté, hasta la estadía más breve es todo facilidad y velocidad!\n\nTrabaja día y noche, reponiendo suministros y poniendo al día los itinerarios por [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]. Me descoloca un momento cuando me pregunta con toda seriedad: «Mi [ROOT.Char.GetTitleAsNameNoTooltip|l], ¿qué vale más, vuestro tiempo o vuestra salud?»."
 court.8198.desc:0 "Mi [position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('antiquarian_court_position').GetName()|l], [position_holder.Custom('ES_ElLa')] [position_holder.GetTitledFirstName|l], cuida perfectamente de mis tesoros: los artículos se mantienen bien limpios y sin polvo, y siempre está list[position_holder.Custom('ES_OA')] para ofrecer alguna curiosidad a todo huésped inquisidor, o no.\n\nCon responsabilidad sobre todo el tesoro [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], no es de extrañar que su tiempo sea comprensiblemente escaso, pero me pregunta, tras haber alabado su buena labor si «¿… hay más objetos que creáis que merecen atención particular, [ROOT.Char.Custom('FormOfAddressForLiege')]?»."

 # event_localization/court_events/court_events_george_l_spanish.yml
 court.7700.a:0 "¡Al ladrón! ¡Guardias, capturad a ese granuja!"

 # event_localization/court_events/court_events_joe_l_spanish.yml
